baseURL = "https://reliableprofessional.services"
locale = "en-us"
title = "Reliable Professional Services"
publishDir = "public"
enableRobotsTXT = true
disableKinds = ["RSS", "taxonomy", "term"]
disableHugoGeneratorInject = true

[outputs]
  home = ["html", "signature"]

[outputFormats.signature]
  mediaType = "text/html"
  baseName = "email-signature"
  isHTML = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      autoHeadingID = false
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        disable = true
